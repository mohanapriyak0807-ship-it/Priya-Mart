<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Priya Footwear - Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd1dc, #fff0f5);
            padding: 20px;
        }

        .register-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px #00000025;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            color: #c2185b;
            margin-bottom: 8px;
        }

        .welcome {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #e91e63;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 25px;
            background: #e91e63;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #c2185b;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login a {
            color: #c2185b;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            text-align: center;
            margin-top: 15px;
        }

        .home a {
            color: #555;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">👟</div>

        <h2>Create Account</h2>

        <p class="welcome">
            Join Priya Footwear & Accessories
        </p>

        <form>

            <!-- Name -->
            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <!-- Email -->
            <label for="email">
                Email ID
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email ID"
                required
            >


            <!-- Mobile Number -->
            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                name="mobile"
                placeholder="Enter your mobile number"
                maxlength="10"
                required
            >


            <!-- Password -->
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <!-- Confirm Password -->
            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm your password"
                required
            >


            <!-- Register Button -->
            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>


        <div class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </div>


        <div class="home">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

</body>
</html>
