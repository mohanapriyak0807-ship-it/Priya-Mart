<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Priya Footwear - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6dd, #fff1e8);
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px #00000025;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #d93655;
            margin-bottom: 8px;
        }

        .welcome {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff5c70;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 25px;
            background: #ff5c70;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #d93655;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .register a {
            color: #d93655;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            text-align: center;
            margin-top: 15px;
        }

        .home a {
            color: #555;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">👟</div>

        <h2>Priya Footwear</h2>

        <p class="welcome">
            Welcome back! Please login to continue.
        </p>

        <form>

            <!-- Email -->
            <label for="email">
                Email ID
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email ID"
                required
            >

            <!-- Password -->
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <!-- Login Button -->
            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

        <div class="home">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

</body>
      </html>
